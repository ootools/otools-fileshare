name: build-plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native-build.yml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/*.test.mjs scripts/*.test.mjs
      - run: node scripts/build-web.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-web
          path: |
            dist/
            web-static/
          if-no-files-found: error
  package:
    needs: [native, web]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: plugin-web
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-native-*
          path: lib
          merge-multiple: true
      - name: Create macOS universal2 library
        run: |
          lipo -create lib/macOS-arm64.dylib lib/macOS-x86_64.dylib -output lib/macOS.dylib
          codesign --force --sign - --timestamp=none lib/macOS.dylib
          rm lib/macOS-arm64.dylib lib/macOS-x86_64.dylib
      - run: node scripts/pack-plugin.mjs
      - run: node scripts/verify-plugin.mjs dist-pack
      - uses: actions/upload-artifact@v4
        with:
          name: oplg
          path: dist-pack/
          if-no-files-found: error
